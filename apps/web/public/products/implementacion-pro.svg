<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <!-- Fondo -->
  <rect width="400" height="300" fill="#fff7f4"/>
  <rect x="0.5" y="0.5" width="399" height="299" rx="12" stroke="#ffd9cc" stroke-width="1"/>

  <!-- 2x2 grid de iconos, centrados. Celdas 140x110 con gap 20. -->

  <!-- Tile 1: Página web (arriba izda) -->
  <g transform="translate(50 40)">
    <rect width="140" height="110" rx="14" fill="#ffffff" stroke="#ffd9cc"/>
    <g transform="translate(38 22)" stroke="#ff592f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <rect x="0" y="0" width="64" height="46" rx="5" fill="#fff2ec"/>
      <path d="M10 12h44M10 22h30M10 32h34"/>
      <path d="M24 54h16M32 46v8"/>
    </g>
  </g>

  <!-- Tile 2: Códigos QR (arriba dcha) -->
  <g transform="translate(210 40)">
    <rect width="140" height="110" rx="14" fill="#ffffff" stroke="#ffd9cc"/>
    <g transform="translate(45 20)" fill="#ff592f">
      <!-- Marcos posicionadores -->
      <rect x="0"  y="0"  width="14" height="14" rx="2"/>
      <rect x="36" y="0"  width="14" height="14" rx="2"/>
      <rect x="0"  y="36" width="14" height="14" rx="2"/>
      <!-- Interior tipo QR -->
      <rect x="20" y="20" width="6" height="6"/>
      <rect x="28" y="20" width="6" height="6"/>
      <rect x="36" y="20" width="6" height="6"/>
      <rect x="44" y="20" width="6" height="6"/>
      <rect x="20" y="28" width="6" height="6"/>
      <rect x="36" y="28" width="6" height="6"/>
      <rect x="44" y="28" width="6" height="6"/>
      <rect x="20" y="36" width="6" height="6"/>
      <rect x="28" y="36" width="6" height="6"/>
      <rect x="44" y="36" width="6" height="6"/>
      <rect x="28" y="44" width="6" height="6"/>
      <rect x="36" y="44" width="6" height="6"/>
      <rect x="44" y="44" width="6" height="6"/>
    </g>
  </g>

  <!-- Tile 3: Formación (abajo izda) -->
  <g transform="translate(50 150)">
    <rect width="140" height="110" rx="14" fill="#ffffff" stroke="#ffd9cc"/>
    <g transform="translate(38 26)" stroke="#ff592f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M32 4L60 18 32 32 4 18 32 4z" fill="#fff2ec"/>
      <path d="M14 24v14c0 4 8 8 18 8s18-4 18-8V24"/>
      <path d="M60 18v18"/>
      <circle cx="60" cy="40" r="2.5" fill="#ff592f"/>
    </g>
  </g>

  <!-- Tile 4: Posicionamiento (abajo dcha) - barras crecientes -->
  <g transform="translate(210 150)">
    <rect width="140" height="110" rx="14" fill="#ffffff" stroke="#ffd9cc"/>
    <g transform="translate(38 24)">
      <rect x="0"  y="42" width="12" height="20" rx="2" fill="#ffd9cc"/>
      <rect x="18" y="30" width="12" height="32" rx="2" fill="#ffb59a"/>
      <rect x="36" y="16" width="12" height="46" rx="2" fill="#ff8f6b"/>
      <rect x="54" y="2"  width="12" height="60" rx="2" fill="#ff592f"/>
    </g>
  </g>
</svg>
