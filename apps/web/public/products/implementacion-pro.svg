<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <!-- Fondo -->
  <rect width="400" height="300" fill="#fff7f4"/>
  <rect x="0.5" y="0.5" width="399" height="299" rx="12" stroke="#ffd9cc" stroke-width="1"/>

  <!-- Título -->
  <text x="200" y="42" text-anchor="middle" fill="#1f1f1f" font-family="DM Sans, system-ui, sans-serif" font-size="18" font-weight="700">Implementación Pro</text>
  <text x="200" y="60" text-anchor="middle" fill="#8a8a8a" font-family="DM Sans, system-ui, sans-serif" font-size="11">Puesta en marcha 360°</text>

  <!-- 2x2 grid de servicios (posiciones: x=48/216, y=90/198, celda 136x88) -->

  <!-- Tile 1: Página web -->
  <g transform="translate(48 90)">
    <rect width="136" height="88" rx="10" fill="#ffffff" stroke="#ffd9cc"/>
    <!-- Icono monitor -->
    <g transform="translate(20 20)" stroke="#ff592f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="0" y="0" width="36" height="26" rx="3" fill="#fff2ec"/>
      <path d="M6 6h24M6 12h16M6 18h20"/>
      <path d="M14 30h8M18 26v4"/>
    </g>
    <text x="70" y="42" fill="#1f1f1f" font-family="DM Sans, system-ui, sans-serif" font-size="12" font-weight="600">Página web</text>
    <text x="70" y="58" fill="#8a8a8a" font-family="DM Sans, system-ui, sans-serif" font-size="10">Landing del local</text>
  </g>

  <!-- Tile 2: Códigos QR -->
  <g transform="translate(216 90)">
    <rect width="136" height="88" rx="10" fill="#ffffff" stroke="#ffd9cc"/>
    <!-- Icono QR simplificado -->
    <g transform="translate(20 20)" fill="#ff592f">
      <rect x="0" y="0" width="9" height="9" rx="1"/>
      <rect x="27" y="0" width="9" height="9" rx="1"/>
      <rect x="0" y="27" width="9" height="9" rx="1"/>
      <rect x="14" y="14" width="4" height="4"/>
      <rect x="21" y="14" width="4" height="4"/>
      <rect x="14" y="21" width="4" height="4"/>
      <rect x="27" y="21" width="4" height="4"/>
      <rect x="21" y="28" width="4" height="4"/>
      <rect x="30" y="30" width="4" height="4"/>
    </g>
    <text x="70" y="42" fill="#1f1f1f" font-family="DM Sans, system-ui, sans-serif" font-size="12" font-weight="600">Códigos QR</text>
    <text x="70" y="58" fill="#8a8a8a" font-family="DM Sans, system-ui, sans-serif" font-size="10">Mesa, carta, pago</text>
  </g>

  <!-- Tile 3: Formación -->
  <g transform="translate(48 198)">
    <rect width="136" height="88" rx="10" fill="#ffffff" stroke="#ffd9cc"/>
    <!-- Icono gorro académico -->
    <g transform="translate(20 20)" stroke="#ff592f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M18 4l16 8-16 8L2 12l16-8z" fill="#fff2ec"/>
      <path d="M8 16v8c0 3 5 5 10 5s10-2 10-5v-8"/>
      <path d="M34 12v10"/>
    </g>
    <text x="70" y="42" fill="#1f1f1f" font-family="DM Sans, system-ui, sans-serif" font-size="12" font-weight="600">Formación</text>
    <text x="70" y="58" fill="#8a8a8a" font-family="DM Sans, system-ui, sans-serif" font-size="10">Uso del sistema</text>
  </g>

  <!-- Tile 4: SEO / posicionamiento -->
  <g transform="translate(216 198)">
    <rect width="136" height="88" rx="10" fill="#ffffff" stroke="#ffd9cc"/>
    <!-- Icono barras + flecha subiendo -->
    <g transform="translate(20 22)">
      <rect x="0" y="18" width="6" height="10" fill="#ffd9cc"/>
      <rect x="10" y="12" width="6" height="16" fill="#ffb59a"/>
      <rect x="20" y="6" width="6" height="22" fill="#ff8f6b"/>
      <rect x="30" y="0" width="6" height="28" fill="#ff592f"/>
      <path d="M0 26L36 2" stroke="#ff592f" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0"/>
    </g>
    <text x="70" y="42" fill="#1f1f1f" font-family="DM Sans, system-ui, sans-serif" font-size="12" font-weight="600">Posicionamiento</text>
    <text x="70" y="58" fill="#8a8a8a" font-family="DM Sans, system-ui, sans-serif" font-size="10">SEO local</text>
  </g>
</svg>
